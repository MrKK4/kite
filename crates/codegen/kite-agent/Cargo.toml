[package]
license = "Apache-2.0"
name = "kite-agent"
version = "0.1.0"
edition.workspace = true
description = "Agent builder, definition parsing, and system prompt assembly"

[dependencies]
dunce = { workspace = true }
kite-hooks = { path = "../kite-hooks" }
kite-sampling-types = { path = "../kite-sampling-types" }
kite-telemetry = { workspace = true }
kite-tools = { path = "../kite-tools" }
kite-tty-utils = { workspace = true }
kite-token-estimation = { workspace = true }
minijinja = { version = "2", features = ["custom_syntax"] }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
regex = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
tracing = { workspace = true }
chrono = { workspace = true }
fs2 = { workspace = true }
ignore = { workspace = true }
kite-config = { workspace = true }
kite-dirs = { workspace = true }
kite-permission-rules = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
zeroize = "1"
kite-tool-types.workspace = true

[features]
default = []
default-bazel = []

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }

[lints]
workspace = true
